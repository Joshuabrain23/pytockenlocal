<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>e-Sevai Digital Kiosk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2e7d32; --secondary: #1565c0; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Arial; background: var(--bg); margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .kiosk-container { background: white; width: 95vw; height: 90vh; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; font-size: 2rem; font-weight: bold; }
        
        .step { display: none; padding: 20px 40px; flex: 1; text-align: center; overflow-y: auto; }
        .active { display: flex; flex-direction: column; align-items: center; }

        h2 { font-size: 2.2rem; color: #333; margin: 10px 0; }
        /* Keyboard and Mouse Support: Input is NOT readonly anymore */
        .display-input { width: 70%; font-size: 2.5rem; padding: 15px; border: 4px solid var(--primary); border-radius: 15px; text-align: center; margin-bottom: 15px; background: #fff; }

        /* Services Grid */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; width: 100%; padding-bottom: 50px; }
        .service-card { background: #fff; border: 2px solid #ddd; border-radius: 15px; padding: 15px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .service-card:hover { border-color: var(--primary); background: #f1f8e9; }
        .service-card:active { transform: scale(0.9); }
        .service-card i { font-size: 2.5rem; margin-bottom: 8px; }
        .service-card span { font-size: 1rem; font-weight: bold; text-align: center; color: #333; }

        /* Icon Colors */
        .ic-orange { color: #ff9800; } .ic-blue { color: #2196f3; } .ic-red { color: #f44336; } .ic-green { color: #4caf50; } .ic-purple { color: #9c27b0; }

        /* Virtual Keyboard */
        .keyboard { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #d1d5db; padding: 10px; width: 90%; border-radius: 10px; }
        .key { background: white; padding: 15px; border-radius: 8px; font-size: 1.2rem; font-weight: bold; border: none; box-shadow: 0 3px 0 #9ca3af; cursor: pointer; user-select: none; }
        .key:active { background: #e5e7eb; transform: translateY(2px); box-shadow: none; }
        .key-wide { grid-column: span 2; background: #9ca3af; color: white; }
        .key-submit { grid-column: span 2; background: var(--primary); color: white; }

        /* Success Page */
        .token-large { font-size: 7rem; color: var(--primary); font-weight: 900; margin: 10px 0; border: 5px solid var(--primary); display: inline-block; padding: 10px 40px; border-radius: 20px; }
        .photo-instruction { background: #fff3e0; padding: 15px; border-radius: 20px; border: 3px dashed #ff9800; display: inline-block; margin-top: 10px; }
        .camera-icon { font-size: 4rem; color: #ff9800; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="kiosk-container">
    <div class="header">e-Sevai Digital Kiosk</div>

    <div class="step active" id="step1">
        <h2>What is your Name?</h2>
        <input type="text" id="nameInput" class="display-input" placeholder="Type name here...">
        <div class="keyboard" id="alphaKey"></div>
    </div>

    <div class="step" id="step2">
        <h2>Enter Phone Number</h2>
        <input type="text" id="phoneInput" class="display-input" placeholder="Type phone number...">
        <div class="keyboard" id="numKey"></div>
    </div>

    <div class="step" id="step3">
        <h2>Select Service</h2>
        <div class="services-grid" id="serviceGrid"></div>
    </div>

    <div class="step" id="step4" style="text-align:center; padding-top:20px;">
        <h2 style="color: var(--primary);">TOKEN GENERATED SUCCESSFULLY!</h2>
        <div class="token-large" id="finalToken">----</div>
        <br>
        <div class="photo-instruction">
            <i class="fas fa-camera-retro camera-icon"></i>
            <h3 style="margin:5px 0;">PLEASE TAKE A PHOTO OF THIS SCREEN</h3>
            <p style="margin:0; font-weight:bold;">உங்கள் டோக்கன் எண்ணை புகைப்படம் எடுக்கவும்</p>
        </div>
        <br><br>
        <button class="key key-submit" style="width: 350px; height: 70px; font-size: 1.8rem;" onclick="resetKiosk()">FINISH / NEW ENTRY</button>
    </div>
</div>

<script>
    // List of 28 services with Icons and Colors
    const services = [
        { n: "Aadhar", i: "fa-id-card", c: "ic-blue" }, { n: "EPFO claim", i: "fa-piggy-bank", c: "ic-green" },
        { n: "Food licence", i: "fa-utensils", c: "ic-orange" }, { n: "GST", i: "fa-file-invoice-dollar", c: "ic-blue" },
        { n: "Pan Card", i: "fa-address-card", c: "ic-red" }, { n: "Patta App", i: "fa-map-marked-alt", c: "ic-green" },
        { n: "Ration card", i: "fa-shopping-basket", c: "ic-orange" }, { n: "TNEB App", i: "fa-bolt", c: "ic-orange" },
        { n: "Legal Heir", i: "fa-users", c: "ic-purple" }, { n: "ABHA Card", i: "fa-heartbeat", c: "ic-red" },
        { n: "Spiral Binding", i: "fa-book", c: "ic-blue" }, { n: "BIRTH CERT", i: "fa-baby", c: "ic-blue" },
        { n: "Certficate", i: "fa-certificate", c: "ic-orange" }, { n: "Community Cert", i: "fa-users-cog", c: "ic-purple" },
        { n: "Income Cert", i: "fa-rupee-sign", c: "ic-green" }, { n: "Life Cert", i: "fa-user-check", c: "ic-blue" },
        { n: "OBC Certificate", i: "fa-id-badge", c: "ic-purple" }, { n: "Death Cert", i: "fa-ribbon", c: "ic-red" },
        { n: "Design/Print", i: "fa-paint-brush", c: "ic-blue" }, { n: "e-shram card", i: "fa-hard-hat", c: "ic-orange" },
        { n: "Farmer Reg", i: "fa-tractor", c: "ic-green" }, { n: "TNPSC Exam", i: "fa-university", c: "ic-red" },
        { n: "Student Exam", i: "fa-user-graduate", c: "ic-blue" }, { n: "Online Govt", i: "fa-globe", c: "ic-blue" },
        { n: "Lost Marksheet", i: "fa-graduation-cap", c: "ic-red" }, { n: "Police Verify", i: "fa-user-shield", c: "ic-blue" },
        { n: "Driving Lic", i: "fa-car", c: "ic-green" }, { n: "RC Book Serv", i: "fa-motorcycle", c: "ic-red" }
    ];

    // Virtual Keyboard Logic
    function createKeyboard(containerId, keys, inputId, nextStep) {
        const kb = document.getElementById(containerId);
        keys.forEach(k => {
            const btn = document.createElement('button');
            btn.className = 'key';
            btn.innerText = k;
            btn.onclick = () => { document.getElementById(inputId).value += k; document.getElementById(inputId).focus(); };
            kb.appendChild(btn);
        });
        
        const del = document.createElement('button');
        del.className = 'key key-wide';
        del.innerText = 'DELETE';
        del.onclick = () => { let v = document.getElementById(inputId).value; document.getElementById(inputId).value = v.slice(0, -1); document.getElementById(inputId).focus(); };
        kb.appendChild(del);

        const next = document.createElement('button');
        next.className = 'key key-submit';
        next.innerText = 'NEXT →';
        next.onclick = () => { if(document.getElementById(inputId).value.length < 2) return alert("Please fill details"); showStep(nextStep); };
        kb.appendChild(next);
    }

    createKeyboard('alphaKey', "ABCDEFGHIJKLMNOPQRSTUVWXYZ ".split(""), 'nameInput', 2);
    createKeyboard('numKey', "1234567890".split(""), 'phoneInput', 3);

    // Build Services Grid
    const grid = document.getElementById('serviceGrid');
    services.forEach(s => {
        const card = document.createElement('div');
        card.className = 'service-card';
        card.innerHTML = `<i class="fas ${s.i} ${s.c}"></i><span>${s.n}</span>`;
        card.onclick = () => finalize(s.n);
        grid.appendChild(card);
    });

    function showStep(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step' + n).classList.add('active');
        // Auto-focus the input if using physical keyboard
        if(n === 1) document.getElementById('nameInput').focus();
        if(n === 2) document.getElementById('phoneInput').focus();
    }

    async function finalize(svc) {
        const payload = {
            name: document.getElementById('nameInput').value,
            phone: document.getElementById('phoneInput').value,
            service: svc
        };

        try {
            const res = await fetch('http://localhost:5000/save', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if(res.ok) {
                document.getElementById('finalToken').innerText = data.token;
                showStep(4);
            }
        } catch (e) { alert("Server is not running! Check PowerShell."); }
    }

    function resetKiosk() {
        // Clear all inputs
        document.getElementById('nameInput').value = "";
        document.getElementById('phoneInput').value = "";
        document.getElementById('finalToken').innerText = "----";
        // Back to start
        showStep(1);
    }

    // Support for physical "Enter" key
    document.getElementById('nameInput').addEventListener('keypress', e => { if(e.key === 'Enter') showStep(2); });
    document.getElementById('phoneInput').addEventListener('keypress', e => { if(e.key === 'Enter') showStep(3); });

</script>

</body>
</html>
